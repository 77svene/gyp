[tool.poetry]
name = "autonomous-marketing-ecosystem"
version = "0.1.0"
description = "Enterprise-grade Autonomous Adaptive Marketing Ecosystem Architecture"
authors = ["Jules <jules@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.0.0"
fastapi = ">=0.100.0"
uvicorn = ">=0.23.0"
httpx = ">=0.24.0"
aio-pika = ">=9.0.0"
redis = ">=5.0.0"
asyncpg = ">=0.28.0"
neo4j = ">=5.0.0"
networkx = ">=3.1"
numpy = ">=1.25.0"
pandas = ">=2.0.0"
polars = ">=0.19.0"
ollama = ">=0.1.0"
langchain-core = ">=0.1.0"
tiktoken = ">=0.4.0"
jinja2 = ">=3.1.2"
apscheduler = ">=3.10.0"
scipy = ">=1.11.0"
scikit-learn = ">=1.3.0"
pyyaml = ">=6.0"
loguru = ">=0.7.0"
python-dotenv = ">=1.0.0"
tenacity = ">=8.2.3"
arq = ">=0.25.0"
pydantic-settings = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
ruff = "^0.0.280"
mypy = "^1.5.0"
black = "^23.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]

[tool.mypy]
ignore_missing_imports = true
strict = false
check_untyped_defs = true
